version: "3.8"
services:
  consul:
    image: consul:1.15
    container_name: consul
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"   # HTTP UI/API
      - "8600:8600/udp" # DNS via consul (optional)
    networks:
      - appnet

  product:
    build: ./api-catalogo-produtos
    container_name: product
    depends_on:
      - consul
      - inventory
    environment:
      - CONSUL_HOST=consul
      - INVENTORY_SERVICE=inventory
      - SERVICE_PORT=80
    ports:
      - "8000:80"
    networks:
      - appnet

  inventory:
    build: ./api-estoque
    container_name: inventory
    environment:
      - CONSUL_HOST=consul
      - SERVICE_PORT=80
    ports:
      - "8001:80"   # locally available at 8001
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
